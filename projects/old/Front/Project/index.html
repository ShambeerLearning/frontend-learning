<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk 2077</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
    <body>
        <header class="header">
            <div class="container">
                <div class="header_wrap">
                    <div class="header_logo">
                        <img src="img/Cyberpunk_2077_logo_1.svg" alt="" class="header-logo">
                    </div>
                    <nav class="nav">
                        <ul class="nav-list">
                            <li class="nav-item">
                            <a href="#" class="nav-link">
                                <img src="img/youtube logo.svg" alt="" class="nav_img">
                            </a>
                            </li>
                            <li class="nav-item">
                            <a href="#" class="nav-link">
                                <img src="img/vk logo.svg" alt="" class="nav_img">
                            </a>
                            </li>
                            <li class="nav-item">
                            <a href="#" class="nav-link">
                                <img src="img/facebook-rect logo.svg" alt="" class="nav_img">
                            </a>
                            </li>  
                            <li class="nav-item">
                            <a href="#" class="nav-link">
                                <img src="img/twitter-square logo.svg" alt="" class="nav_img">
                            </a>
                            </li>
                            <li class="nav-item">
                            <a href="#" class="nav-link">
                                <img src="img/twitch logo.svg" alt="" class="nav_img">
                            </a>
                            </li>
                            <li class="nav-item">
                            <a href="#" class="nav-link">
                                <img src="img/instagram-square logo.svg" alt="" class="nav_img">
                            </a>
                            </li>
                        </ul>
                    </nav>
                </div>
                <div class="banner">
                    <div class="banner-bg">
                    <h3 class="banner_text">Доступно на <br> всех платформах</h3>
                    <button class="banner-button">
                        <a href="#" class="banner-link">
                            Узнать больше
                        </a>
                    </button>
                    </div>
                </div>
            </div>
        </header>
    </body>
</html>
